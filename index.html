<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 22nd Birthday, Kiana!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px 0;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 10;
      animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .hidden {
      display: none !important;
    }

    /* Screen Transition Effects */
    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Floating Balloons Background */
    .balloon-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      width: 40px;
      height: 50px;
      background-color: rgba(255, 215, 0, 0.7);
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      animation: floatUp 8s linear infinite;
    }

    .balloon::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 19px;
      width: 2px;
      height: 14px;
      background-color: #fff;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) rotate(20deg);
        opacity: 0;
      }
    }

    /* Screen 1 Styles */
    .title-screen1 {
      color: #FFFF00; /* Yellow */
      font-size: 2.2rem;
      margin-bottom: 25px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 255, 0, 0.3);
    }

    .interactive-img {
      max-width: 100%;
      max-height: 400px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 15px;
      border: 3px solid #FFFF00;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 255, 0, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .interactive-img:hover {
      transform: scale(1.03);
      box-shadow: 0 0 35px rgba(255, 255, 0, 0.8);
    }

    .interactive-img:active {
      transform: scale(0.97);
    }

    .click-hint {
      margin-top: 15px;
      color: #aaaaaa;
      font-size: 0.9rem;
    }

    /* Screen 2 Styles */
    .message-card {
      background-color: #111111;
      border: 2px solid #333333;
      border-radius: 15px;
      padding: 25px;
      text-align: left;
      line-height: 1.6;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      margin-bottom: 25px;
      white-space: pre-line;
      color: #f0f0f0;
      font-size: 1.05rem;
    }

    /* Button Animations & Effects */
    .btn {
      background-color: #FFFF00;
      color: #000000;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(255, 255, 0, 0.3);
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background-color: #ffff66;
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 255, 0, 0.5);
    }

    .btn:active {
      transform: translateY(1px) scale(0.96);
      box-shadow: 0 2px 10px rgba(255, 255, 0, 0.2);
    }

    /* Screen 3 Styles (Gallery) */
